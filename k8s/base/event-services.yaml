          image: "505980114754.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service:326de1f@sha256:77ea4bc1fc8740e333b8fab2c33d7dec504f4145be6f35a1385d172e0c156675"
          imagePullPolicy: IfNotPresent
          ports:
