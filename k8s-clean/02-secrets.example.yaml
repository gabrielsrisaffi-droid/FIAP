apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://<DB_USER>:<DB_PASSWORD>@<AUTH_RDS_ENDPOINT>:5432/auth_db?sslmode=require"
  MASTER_KEY: "<MASTER_KEY>"

---
apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: togglemaster
type: Opaque
stringData:
  DATABASE_URL: "postgres://<DB_USER>:<DB_PASSWORD>@<FLAG_RDS_ENDPOINT>:5432/flags_db?sslmode=require"

---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
