type: Opaque
stringData:
  DATABASE_URL: "postgres://<DB_USER>:<DB_PASSWORD>@<TARGETING_RDS_ENDPOINT>:5432/targeting_db?sslmode=require"

---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: togglemaster
type: Opaque
stringData:
