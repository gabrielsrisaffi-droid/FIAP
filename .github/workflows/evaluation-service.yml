name: Evaluation Service CI

on:
  pull_request:
    paths:
      - "evaluation-service/evaluation-service-main/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/scripts/update-image.py"
  push:
    branches: [main]
    paths:
      - "evaluation-service/evaluation-service-main/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/scripts/update-image.py"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: evaluation-service
      service-directory: evaluation-service/evaluation-service-main
      language: go
      manifest: k8s/base/event-services.yaml
    secrets: inherit
