name: Reusable service CI and DevSecOps

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-directory:
        required: true
        type: string
      language:
        required: true
        type: string
      manifest:
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: togglemaster/${{ inputs.service-name }}

jobs:
  quality-and-security:
    name: Tests, lint, SAST and SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.service-directory }}/go.mod
          cache-dependency-path: ${{ inputs.service-directory }}/go.sum

      - name: Run Go tests
        if: inputs.language == 'go'
        run: go test ./...

      - name: Run Go lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ inputs.service-directory }}

      - name: Run Go SAST
        if: inputs.language == 'go'
        uses: securego/gosec@v2.28.0
        with:
          args: ./${{ inputs.service-directory }}/...

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ inputs.service-directory }}/requirements.txt

      - name: Install Python quality tools and dependencies
        if: inputs.language == 'python'
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff==0.12.12 bandit==1.9.4

      - name: Validate Python compilation
        if: inputs.language == 'python'
        run: python -m compileall -q .

      - name: Run Python lint
        if: inputs.language == 'python'
        run: ruff check .

      - name: Run Python SAST
        if: inputs.language == 'python'
        run: bandit -r . -ll

      - name: Scan source dependencies and vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service-directory }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  container-security:
    name: Docker build and container scan
    runs-on: ubuntu-latest
    needs: quality-and-security
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build local image
        run: docker build --tag "${{ inputs.service-name }}:${GITHUB_SHA}" "${{ inputs.service-directory }}"

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish-and-update-gitops:
    name: Publish to ECR and update GitOps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: container-security
    permissions:
      contents: write
    concurrency:
      group: togglemaster-gitops-${{ inputs.service-name }}
      cancel-in-progress: false
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure temporary AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm expected AWS Academy account
        run: aws sts get-caller-identity --query Account --output text | grep -Fx "${AWS_ACCOUNT_ID}"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --tag "${IMAGE_URI}" "${{ inputs.service-directory }}"
          docker push "${IMAGE_URI}"

      - name: Resolve digest and update Kubernetes manifest
        env:
          REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "${DIGEST}"
          test "${DIGEST}" != "None"
          python .github/scripts/update-image.py \
            --manifest "${{ inputs.manifest }}" \
            --repository "${REGISTRY}/${ECR_REPOSITORY}" \
            --image "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}@${DIGEST}"

      - name: Commit and push GitOps change
        run: |
          if git diff --quiet -- "${{ inputs.manifest }}"; then
            echo "Manifest already references this immutable image."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.manifest }}"
          git commit -m "Atualiza ${{ inputs.service-name }} para ${GITHUB_SHA:0:7}"
          for attempt in {1..10}; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main avançou; sincronizando antes da tentativa $((attempt + 1))."
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Não foi possível publicar a atualização GitOps após 10 tentativas."
          exit 1
