name: Targeting Service CI

on:
  pull_request:
    paths:
      - "targeting-service/targeting-service-main/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/scripts/update-image.py"
  push:
    branches: [main]
    paths:
      - "targeting-service/targeting-service-main/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/_service-ci.yml"
      - ".github/scripts/update-image.py"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: targeting-service
      service-directory: targeting-service/targeting-service-main
      language: python
      manifest: k8s/base/core-services.yaml
    secrets: inherit
