apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: "https://github.com/gabrielsrisaffi-droid/FIAP.git"
    targetRevision: "main"
    path: observability/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster

  # A remediation changes only this runtime annotation. Preserve it during GitOps syncs.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: evaluation-service
      jsonPointers:
        - /spec/template/metadata/annotations/togglemaster.fiap~1restartedAt

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

  revisionHistoryLimit: 5
