{{ if .Values.notifications.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bridge
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: discord-bridge}
  template:
    metadata:
      labels: {app: discord-bridge}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: bridge
          image: {{ .Values.images.python }}
          command: [python, -B, -u, /app/discord_bridge.py]
          env:
{{ range $key := list "PAGERDUTY_API_TOKEN" "PAGERDUTY_SERVICE_ID" "DISCORD_WEBHOOK_URL" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: {{ $key }}}
{{ end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: code
          configMap: {name: observability-config}
        - name: state
{{ if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: discord-state}
{{ else }}
          emptyDir: {}
{{ end }}
{{ if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-state
spec:
  accessModes: [ReadWriteOnce]
{{ if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
{{ end }}
  resources:
    requests: {storage: 1Gi}
{{ end }}
{{ end }}
