apiVersion: 1
groups:
  - orgId: 1
    name: togglemaster-errors
    folder: ToggleMaster
    interval: 30s
    rules:
      - uid: evaluation-high-error-rate
        title: EvaluationHighErrorRate
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Mais de 5% de erros 5xx no evaluation-service por 1 minuto
          description: Verificar o trace e os logs da avaliação antes de investigar dependências.
        labels:
          service_name: evaluation-service
          severity: critical
          automation: restart-evaluation
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              expr: '((sum(rate(togglemaster_http_requests_total{service_name="evaluation-service",http_response_status_code=~"5.."}[2m])) or vector(0)) / clamp_min(sum(rate(togglemaster_http_requests_total{service_name="evaluation-service"}[2m])), 0.001) * 100) and on() (sum(increase(togglemaster_http_requests_total{service_name="evaluation-service"}[2m])) >= 20)'
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [5]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
