# Standalone local observability; no AWS resources or external messages.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../chart/files/collector.yaml:/etc/otel/config.yaml:ro
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [loki]
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ../chart/files/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../chart/files/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Defina uma senha local antes de iniciar}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../chart/files/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../chart/files/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../chart/files/alerts.yaml:/etc/grafana/provisioning/alerting/alerts.yaml:ro
      - ./contacts.yaml:/etc/grafana/provisioning/alerting/contacts.yaml:ro
      - ../chart/files/dashboard.json:/var/lib/grafana/dashboards/togglemaster.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
volumes:
  prometheus-data:
  loki-data:
  grafana-data:
